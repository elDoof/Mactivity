name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: ./build_app.sh

      - name: Verify bundle
        run: |
          test -x MactivityMonitor.app/Contents/MacOS/MactivityMonitor
          plutil -lint MactivityMonitor.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 MactivityMonitor.app
